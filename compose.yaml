name: photo-selector
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${PHOTO_SELECTOR_BIND:-0.0.0.0}:${PHOTO_SELECTOR_PORT:-4173}:4173"
    environment:
      PHOTO_SELECTOR_PUBLIC_URL: "${PHOTO_SELECTOR_PUBLIC_URL:-http://localhost:${PHOTO_SELECTOR_PORT:-4173}}"
      PHOTO_SELECTOR_ALLOWED_ORIGINS: "${PHOTO_SELECTOR_ALLOWED_ORIGINS:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - photo-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  photo-data:
    name: "${PHOTO_SELECTOR_VOLUME:-photo-selector-data}"
