name: macOS checks
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vision
      - name: Test and build web application
        run: npm run check
      - name: Test and build WeChat application
        run: npm run test:wechat && npm run build:wechat
      - name: Test native foundation
        run: bash scripts/test.sh
      - name: Install browser for UI tests
        run: npx playwright install chromium
      - name: End-to-end browser verification
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
