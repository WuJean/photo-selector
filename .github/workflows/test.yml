name: Application checks
on: [push, pull_request]
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build container and verify deployment with isolated photos
        run: npm run test:docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-browser-evidence
          path: test-results/docker/
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vision
      - name: Test and build web application
        run: npm run check
      - name: Verify native production deployment and lifecycle
        run: npm run test:native
      - name: Test and build WeChat application
        run: npm run test:wechat && npm run build:wechat
      - name: Test native foundation
        run: bash scripts/test.sh
      - name: Install browser for UI tests
        run: npx playwright install chromium
      - name: End-to-end browser verification
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
